function addMember(){

    const input = document.getElementById("newMember");
    const name = input.value.trim();

    if(!name){
        alert("የአባል ስም ያስገቡ።");
        return;
    }

    members.push(name);
    lotteryData.available.push(name);

    input.value = "";

    saveAll();
    renderAll();

    showToast("✅ " + name + " እንደ አዲስ አባል ተጨመረ።");
}
